<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Pablo Santos - Git activity</title>
<style>
:root{--navy:#0A1428;--panel:#101E3A;--edge:#1B2C52;--blue:#2F6FED;--ice:#5CC8FF;--peri:#8AA4FF;--pale:#B9D0FF;--text:#E6ECF8;--muted:#6B7FA3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--navy);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 32px}
h1{font-size:22px;margin:8px 0 2px}
.sub{color:var(--peri);margin:0 0 18px;font-size:14px}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:16px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat b{display:block;font-size:30px;line-height:1.1}
.stat span{color:var(--peri);font-size:12px}
#grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);gap:3px;touch-action:none;user-select:none}
.c,.sp{aspect-ratio:1}.c{border-radius:3px;background:var(--edge);opacity:0;animation:pop .5s ease-out forwards}
.l1{background:var(--blue)}.l2{background:var(--peri)}.l3{background:var(--ice)}.l4{background:var(--pale)}
.c.sel{outline:2px solid var(--text);outline-offset:1px;z-index:1;position:relative}
.c.rip{animation:ripple .6s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes ripple{0%{transform:scale(1)}40%{transform:scale(1.6);filter:brightness(1.4)}100%{transform:scale(1)}}
#info{min-height:64px;margin-top:14px;border-top:1px solid var(--edge);padding-top:12px}
#info b{font-size:22px}
#info span{color:var(--peri);display:block;font-size:14px}
.hint{color:var(--muted);font-size:13px;margin:10px 2px 0}
.legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;color:var(--muted);font-size:12px;margin-top:10px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
.back{color:var(--ice);font-size:14px}
@media (prefers-reduced-motion: reduce){.c{animation:none;opacity:1}.c.rip{animation:none}}
</style>
</head>
<body>
<main>
<h1>Git activity</h1>
<p class="sub">Last 26 weeks. Tap or drag across the days.</p>
<section class="card stats" aria-live="polite">
<div class="stat"><b id="total">0</b><span>contributions</span></div>
<div class="stat"><b id="streak">0</b><span>day streak</span></div>
<div class="stat"><b id="best">0</b><span>best day</span></div>
</section>
<section class="card">
<div id="grid" role="grid" aria-label="Contributions per day"></div>
<div class="legend"><span>Less</span><i style="background:var(--edge)"></i><i style="background:var(--blue)"></i><i style="background:var(--peri)"></i><i style="background:var(--ice)"></i><i style="background:var(--pale)"></i><span>More</span></div>
<div id="info"><b>Pick a day</b><span>Touch any square to see its date and count.</span></div>
</section>
<p class="hint" id="msg"></p>
</main>
<script>
(function () {
  var grid = document.getElementById("grid"), info = document.getElementById("info"), cells = [], sel = null;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function level(n, peak) { return n <= 0 || peak <= 0 ? 0 : Math.max(1, Math.min(4, Math.ceil(4 * n / peak))); }
  function countUp(el, to) {
    if (reduce || to < 1) { el.textContent = to; return; }
    var t0 = performance.now();
    (function step(t) { var k = Math.min(1, (t - t0) / 900); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); })(t0);
  }
  function show(c) {
    if (!c) return;
    if (sel) sel.classList.remove("sel");
    sel = c; c.classList.add("sel");
    var n = +c.dataset.n, d = new Date(c.dataset.d + "T12:00:00");
    info.innerHTML = "<b>" + n + (n === 1 ? " contribution" : " contributions") + "</b><span>" +
      d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" }) + "</span>";
    if (navigator.vibrate) navigator.vibrate(8);
    if (reduce) return;
    var col = +c.dataset.col, row = +c.dataset.row;
    cells.forEach(function (o) {
      var dist = Math.abs(o.dataset.col - col) + Math.abs(o.dataset.row - row);
      if (dist > 6) return;
      o.classList.remove("rip"); void o.offsetWidth;
      o.style.animationDelay = (dist * 35) + "ms"; o.classList.add("rip");
    });
  }
  function fromPoint(e) { var el = document.elementFromPoint(e.clientX, e.clientY); return el && el.classList.contains("c") ? el : null; }
  grid.addEventListener("pointerdown", function (e) { show(fromPoint(e)); });
  grid.addEventListener("pointermove", function (e) { if (e.buttons || e.pointerType === "touch") { var c = fromPoint(e); if (c && c !== sel) show(c); } });
  grid.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse") show(fromPoint(e)); }, true);
  fetch("./activity.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (data) {
    var keys = Object.keys(data.days).sort(), peak = 0, best = 0, streak = 0;
    keys.forEach(function (k) { peak = Math.max(peak, data.days[k]); });
    var first = new Date(keys[0] + "T12:00:00"), offset = first.getDay();
    grid.style.gridTemplateColumns = "repeat(" + Math.ceil((keys.length + offset) / 7) + ",1fr)";
    for (var i = 0; i < offset; i++) { var gap = document.createElement("div"); gap.className = "sp"; grid.appendChild(gap); }
    keys.forEach(function (k, i) {
      var n = data.days[k], c = document.createElement("div"), idx = i + offset;
      c.className = "c l" + level(n, peak); c.dataset.n = n; c.dataset.d = k;
      c.dataset.col = Math.floor(idx / 7); c.dataset.row = idx % 7;
      c.style.animationDelay = (Math.floor(idx / 7) * 30) + "ms";
      c.setAttribute("role", "gridcell"); c.setAttribute("aria-label", k + ": " + n);
      grid.appendChild(c); cells.push(c); best = Math.max(best, n);
    });
    for (var j = keys.length - 1; j >= 0; j--) { if (data.days[keys[j]] > 0) streak++; else if (j === keys.length - 1) continue; else break; }
    countUp(document.getElementById("total"), data.total);
    countUp(document.getElementById("streak"), streak);
    countUp(document.getElementById("best"), best);
    show(cells[cells.length - 1]);
  }).catch(function () { document.getElementById("msg").textContent = "Could not load activity data."; });
})();
</script>
</body>
</html>
