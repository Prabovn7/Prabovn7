name: Update activity graph

on:
  schedule:
    - cron: "17 6 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate assets/activity.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/gen_activity.py --user "${{ github.repository_owner }}" --out assets/activity.svg --months assets/activity-months.svg
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg assets/activity-months.svg
          git diff --cached --quiet || git commit -m "chore: update activity graph"
          git push
