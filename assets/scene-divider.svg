<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 40" width="800" height="40" role="img" aria-label="Section divider"><title>Section divider</title><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#2F6FED" stop-opacity="0"/><stop offset=".5" stop-color="#2F6FED"/><stop offset="1" stop-color="#2F6FED" stop-opacity="0"/></linearGradient><linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#5CC8FF" stop-opacity="0"/><stop offset=".5" stop-color="#5CC8FF"/><stop offset="1" stop-color="#5CC8FF" stop-opacity="0"/></linearGradient><style>text{font-family:-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif}.sw{animation:sweep 4.5s ease-in-out infinite}@keyframes sweep{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(560px);opacity:0}}.nd{transform-box:fill-box;transform-origin:center;animation:beat 2.4s ease-in-out infinite}@keyframes beat{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.6);opacity:.4}}@media (prefers-reduced-motion: reduce){.sw,.nd{animation:none}.sw{opacity:0}}</style><rect x="20" y="19" width="760" height="2" rx="1" fill="url(#ln)"/><rect class="sw" x="60" y="18" width="120" height="4" rx="2" fill="url(#hl)"/><circle class="nd" cx="400" cy="20" r="4" fill="#5CC8FF"/><circle cx="400" cy="20" r="2" fill="#E6ECF8"/></svg>
