<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 52" width="460" height="52" role="img" aria-label="Building APIs, architecture and security"><title>Building APIs, architecture and security</title><style>text{font-family:-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif}.pre{font-size:20px;fill:#8AA4FF}.w{font-size:24px;font-weight:700;fill:#5CC8FF}.cycle{opacity:0;animation:role 7.5s ease-in-out infinite both}@keyframes role{0%{opacity:0;transform:translateY(8px)}5%,28%{opacity:1;transform:none}33%,100%{opacity:0;transform:translateY(-8px)}}.static{display:none}.ul{stroke-dasharray:60;animation:ul 2.5s ease-in-out infinite}@keyframes ul{0%,100%{stroke-dashoffset:60}40%,70%{stroke-dashoffset:0}}@media (prefers-reduced-motion: reduce){.cycle{display:none}.ul{display:none}.static{display:inline}}</style><text class="pre" x="0" y="34">Building</text><text class="cycle w" x="104" y="34" style="animation-delay:0.0s">APIs</text><text class="cycle w" x="104" y="34" style="animation-delay:2.5s">Architecture</text><text class="cycle w" x="104" y="34" style="animation-delay:5.0s">Security</text><line class="ul" x1="104" y1="42" x2="164" y2="42" stroke="#2F6FED" stroke-width="2" stroke-linecap="round"/><g class="static"><text class="w" x="104" y="34" style="font-size:20px">APIs · Architecture · Security</text></g></svg>
