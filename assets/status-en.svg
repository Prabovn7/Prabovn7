<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 64" width="100%" style="max-width:720px" role="img" aria-label="Open to junior and internship backend opportunities">
<defs>
<radialGradient id="vg" cx="50%" cy="50%" r="75%"><stop offset="0" stop-color="#141414"/><stop offset="1" stop-color="#050505"/></radialGradient>
<linearGradient id="sw" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#E6E6E6" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".16"/><stop offset="1" stop-color="#E6E6E6" stop-opacity="0"/></linearGradient>
<filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="sc" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity=".28"/></pattern>
</defs>
<rect x=".75" y=".75" width="718.5" height="62.5" rx="31.25" fill="#050505" stroke="#E6E6E6" stroke-opacity=".6" stroke-width="1.5"/>
<circle cx="36" cy="32" r="6" fill="#E6E6E6" filter="url(#gl)"><animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/></circle>
<circle cx="36" cy="32" r="6" fill="none" stroke="#E6E6E6" stroke-width="1.5"><animate attributeName="r" values="6;16" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="1.8s" repeatCount="indefinite"/></circle>
<text x="62" y="39" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="22" fill="#FFFFFF">Open to junior and internship backend opportunities</text>
</svg>
