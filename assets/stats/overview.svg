<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 252" width="100%" role="img" aria-label="GitHub overview: public repositories, stars, followers and languages">
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.row,.tile{animation:rise .6s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.dot{transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out both}
.num{transform-box:fill-box;transform-origin:left bottom;animation:pop .7s ease-out both}
@keyframes pop{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}
.live{animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.row,.tile,.bar,.dot,.num,.live{animation:none}}
</style>
<rect x=".5" y=".5" width="559" height="251" rx="16" fill="#101E3A" stroke="#1B2C52"/>
<g class="tile" style="animation-delay:0.10s"><rect x="20" y="20" width="251" height="100" rx="14" fill="#0A1428" stroke="#1B2C52"/><rect x="40" y="20" width="48" height="4" rx="2" fill="#2F6FED"/><text class="num" x="42" y="82" font-size="44" font-weight="700" fill="#E6ECF8" style="animation-delay:0.30s">6</text><text x="42" y="106" font-size="15" fill="#8AA4FF">public repositories</text></g><g class="tile" style="animation-delay:0.25s"><rect x="289" y="20" width="251" height="100" rx="14" fill="#0A1428" stroke="#1B2C52"/><rect x="309" y="20" width="48" height="4" rx="2" fill="#5CC8FF"/><text class="num" x="311" y="82" font-size="44" font-weight="700" fill="#E6ECF8" style="animation-delay:0.45s">6</text><text x="311" y="106" font-size="15" fill="#8AA4FF">stars received</text></g><g class="tile" style="animation-delay:0.40s"><rect x="20" y="136" width="251" height="100" rx="14" fill="#0A1428" stroke="#1B2C52"/><rect x="40" y="136" width="48" height="4" rx="2" fill="#8AA4FF"/><text class="num" x="42" y="198" font-size="44" font-weight="700" fill="#E6ECF8" style="animation-delay:0.60s">6</text><text x="42" y="222" font-size="15" fill="#8AA4FF">followers</text></g><g class="tile" style="animation-delay:0.55s"><rect x="289" y="136" width="251" height="100" rx="14" fill="#0A1428" stroke="#1B2C52"/><rect x="309" y="136" width="48" height="4" rx="2" fill="#B9D0FF"/><text class="num" x="311" y="198" font-size="44" font-weight="700" fill="#E6ECF8" style="animation-delay:0.75s">7</text><text x="311" y="222" font-size="15" fill="#8AA4FF">languages</text></g>
</svg>
