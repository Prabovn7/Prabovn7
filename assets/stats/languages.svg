<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 404" width="100%" role="img" aria-label="Most used languages across public repositories">
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.row,.tile{animation:rise .6s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.dot{transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out both}
.num{transform-box:fill-box;transform-origin:left bottom;animation:pop .7s ease-out both}
@keyframes pop{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}
.live{animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.row,.tile,.bar,.dot,.num,.live{animation:none}}
</style>
<rect x=".5" y=".5" width="559" height="403" rx="16" fill="#101E3A" stroke="#1B2C52"/>
<text x="24" y="42" font-size="22" font-weight="600" fill="#E6ECF8">Most used languages</text>
<circle class="live" cx="408" cy="36" r="4" fill="#5CC8FF"/>
<text x="420" y="41" font-size="13" fill="#8AA4FF">updated daily</text>
<text x="24" y="68" font-size="13" fill="#8AA4FF">By bytes of code, public repositories</text>
