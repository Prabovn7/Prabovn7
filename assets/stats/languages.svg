xt x="48" y="294" font-size="18" fill="#E6ECF8">VBA</text><rect x="170" y="282" width="300" height="12" rx="6" fill="#1B2C52"/><rect class="bar" x="170" y="282" width="4.0" height="12" rx="6" fill="#2F6FED" style="animation-delay:0.73s"/><text x="528" y="293" text-anchor="end" font-size="15" fill="#8AA4FF">0.6%</text></g><g class="row" style="animation-delay:0.75s"><circle class="dot" cx="32" cy="332" r="6" fill="#5CC8FF" style="animation-delay:0.75s"/><text x="48" y="338" font-size="18" fill="#E6ECF8">HTML</text><rect x="170" y="326" width="300" height="12" rx="6" fill="#1B2C52"/><rect class="bar" x="170" y="326" width="4.0" height="12" rx="6" fill="#5CC8FF" style="animation-delay:0.85s"/><text x="528" y="337" text-anchor="end" font-size="15" fill="#8AA4FF">0.3%</text></g><g class="row" style="animation-delay:0.87s"><circle class="dot" cx="32" cy="376" r="6" fill="#8AA4FF" style="animation-delay:0.87s"/><text x="48" y="382" font-size="18" fill="#E6ECF8">Other</text><rect x="170" y="370" width="300" height="12" rx="6" fill="#1B2C52"/><rect class="bar" x="170" y="370" width="4.0" height="12" rx="6" fill="#8AA4FF" style="animation-delay:0.97s"/><text x="528" y="381" text-anchor="end" font-size="15" fill="#8AA4FF">0.2%</text></g>
