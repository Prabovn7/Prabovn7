<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 8" width="300" height="8" role="img" aria-label="Accent bar"><title>Accent bar</title><clipPath id="bc"><rect width="300" height="8" rx="4"/></clipPath><style>text{font-family:-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif}.f{transform-box:fill-box;transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.g{animation:glide 3s ease-in-out infinite 1.2s}@keyframes glide{0%{transform:translateX(-60px)}100%{transform:translateX(320px)}}@media (prefers-reduced-motion: reduce){.f,.g{animation:none}.g{opacity:0}}</style><rect width="300" height="8" rx="4" fill="#1B2C52"/><g clip-path="url(#bc)"><rect class="f" width="300" height="8" fill="#8AA4FF"/><rect class="g" width="50" height="8" fill="#E6ECF8" fill-opacity=".35"/></g></svg>
